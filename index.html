<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clay Home — Interactive Pottery Studio</title>
  <meta name="description" content="Clay Home — Shape pottery with your hands using webcam hand tracking and a 3D clay wheel.">

  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/ui-overlay.css">
  <link rel="stylesheet" href="styles/webcam.css">
</head>
<body class="app-loading">

  <!-- Background Photo -->
  <div id="bgPhoto"></div>

  <!-- Three.js Scene Container -->
  <div id="scene"></div>

  <!-- Status -->
  <div id="status">initializing…</div>

  <!-- ═══════════════════════════════════════════════════════════
       LOADING SCREEN
       Renders immediately before any JS parses.
       ═══════════════════════════════════════════════════════════ -->
  <div id="loading-screen">
    <div class="ls-logo">Clay Home</div>
    <div class="ls-wheel"></div>
    <div class="ls-track"><div class="ls-bar" id="ls-bar"></div></div>
    <div class="ls-status" id="ls-status">Initializing…</div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       UI OVERLAY — Frosted Glass Panels
       ═══════════════════════════════════════════════════════════ -->
  <div class="cs-ux" id="cs-ux">

    <!-- ── Top Bar ──────────────────────────────────────────── -->
    <div class="cs-topbar">
      <div class="cs-brand">
        <div class="cs-brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3h8M9 3v3a4 4 0 0 0-2 3.5C7 13 9 14 9 17v3h6v-3c0-3 2-4 2-7.5A4 4 0 0 0 15 6V3"/>
          </svg>
        </div>
        <div class="cs-brand-name">Clay Home</div>
      </div>
      <div class="cs-top-actions">
        <button class="cs-top-btn" title="Help">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 2-2.5 3.5"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>
        </button>
        <button class="cs-top-btn" title="Camera">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <button class="cs-top-btn" title="Lighting">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="cs-top-btn" title="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>

    <!-- ── Left Tool Dock ───────────────────────────────────── -->
    <div class="cs-tooldock" id="cs-tooldock">
      <div class="cs-tool" data-tool="sculpt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l5-5 4 4-5 5z"/><path d="M14 6l-4-1-4 4 1 4-3 3 2 2 3-3 4 1 4-4"/></svg>
        <div class="cs-tool-label">Sculpt</div>
      </div>
      <div class="cs-tool" data-tool="shape">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c4 4 6 7 6 11a6 6 0 0 1-12 0c0-4 2-7 6-11z"/></svg>
        <div class="cs-tool-label">Shape</div>
      </div>
      <div class="cs-tool" data-tool="smooth">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 14c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/>
          <path d="M3 9c2-3 4-3 6 0s4 3 6 0 4-3 6 0" opacity="0.55"/>
        </svg>
        <div class="cs-tool-label">Smooth</div>
      </div>
      <div class="cs-tool" data-tool="materials">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="15" r="5"/></svg>
        <div class="cs-tool-label">Materials</div>
      </div>
    </div>

    <!-- ── Right Panel: Sculpt (Adjust) ─────────────────────── -->
    <div class="cs-right-panel" id="panel-sculpt">
      <div class="cs-panel-head">
        <div class="cs-panel-title">Adjust</div>
        <button class="cs-panel-close" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="cs-slider-row">
        <div class="cs-slider-head">
          <div class="cs-slider-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l5-5 4 4-5 5z"/><path d="M14 6l-4-1-4 4 1 4-3 3 2 2 3-3 4 1 4-4"/></svg>
            Shape
          </div>
          <span class="cs-slider-val" id="cs-shape-v">25%</span>
        </div>
        <input class="cs-slider" id="cs-shape" type="range" min="0" max="100" value="25" />
      </div>
      <div class="cs-slider-row">
        <div class="cs-slider-head">
          <div class="cs-slider-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10v4M11 10v4M15 10v4"/></svg>
            Pressure
          </div>
          <span class="cs-slider-val" id="cs-pressure-v">25%</span>
        </div>
        <input class="cs-slider" id="cs-pressure" type="range" min="0" max="100" value="25" />
      </div>
    </div>

    <!-- ── Right Panel: Shape ───────────────────────────────── -->
    <div class="cs-right-panel" id="panel-shape">
      <div class="cs-panel-head">
        <div class="cs-panel-title">Shape</div>
        <button class="cs-panel-close" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="cs-mat-section">
        <div class="cs-mat-label">Silhouette</div>
        <div class="cs-shape-presets">
          <button class="cs-shape-preset active" data-shape="bell" title="Bell">
            <svg viewBox="0 0 32 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4 Q5 18 5 28 Q5 36 16 36 Q27 36 27 28 Q27 18 21 4 Z"/>
            </svg>
            <span>Bell</span>
          </button>
          <button class="cs-shape-preset" data-shape="cylinder" title="Cylinder">
            <svg viewBox="0 0 32 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 6 L6 34 L26 34 L26 6 Z"/>
              <ellipse cx="16" cy="6" rx="10" ry="3"/>
            </svg>
            <span>Cylinder</span>
          </button>
          <button class="cs-shape-preset" data-shape="square" title="Square">
            <svg viewBox="0 0 32 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="6" width="20" height="28"/>
            </svg>
            <span>Square</span>
          </button>
        </div>
      </div>
      <div class="cs-slider-row">
        <div class="cs-slider-head">
          <div class="cs-slider-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16M6 18V12M18 18V12M6 12h12"/></svg>
            Base Width
          </div>
          <span class="cs-slider-val" id="cs-shape-base-v">0.22</span>
        </div>
        <input class="cs-slider" id="cs-shape-base" type="range" min="0.05" max="0.32" step="0.005" value="0.22" />
      </div>
      <div class="cs-slider-row">
        <div class="cs-slider-head">
          <div class="cs-slider-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M6 6v6M18 6v6M6 12h12"/></svg>
            Top Width
          </div>
          <span class="cs-slider-val" id="cs-shape-top-v">0.08</span>
        </div>
        <input class="cs-slider" id="cs-shape-top" type="range" min="0.0" max="0.32" step="0.005" value="0.08" />
      </div>
      <button class="cs-action-btn" id="cs-shape-apply">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Apply &amp; Reset
      </button>
    </div>

    <!-- ── Right Panel: Smooth ──────────────────────────────── -->
    <div class="cs-right-panel" id="panel-smooth">
      <div class="cs-panel-head">
        <div class="cs-panel-title">Smooth</div>
        <button class="cs-panel-close" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="cs-slider-row">
        <div class="cs-slider-head">
          <div class="cs-slider-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/></svg>
            Strength
          </div>
          <span class="cs-slider-val" id="cs-smooth-strength-v">35%</span>
        </div>
        <input class="cs-slider" id="cs-smooth-strength" type="range" min="0" max="100" value="35" />
      </div>
      <button class="cs-action-btn" id="cs-smooth-apply">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><path d="M3 9c2-3 4-3 6 0s4 3 6 0 4-3 6 0" opacity="0.55"/></svg>
        Smooth
      </button>
    </div>

    <!-- ── Right Panel: Materials ───────────────────────────── -->
    <div class="cs-right-panel" id="panel-materials">
      <div class="cs-panel-head">
        <div class="cs-panel-title">Materials</div>
        <button class="cs-panel-close" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="cs-mat-section">
        <div class="cs-mat-label">Clay Color</div>
        <div class="cs-mat-swatch-wrap">
          <input type="color" class="cs-color-input" id="cs-mat-color" value="#a8562b" />
          <div class="cs-mat-hex" id="cs-mat-hex">#A8562B</div>
        </div>
      </div>
      <div class="cs-mat-section">
        <div class="cs-mat-label">Presets</div>
        <div class="cs-mat-presets">
          <button class="cs-mat-preset active" data-color="#a8562b" style="background:#a8562b" title="Terracotta"></button>
          <button class="cs-mat-preset" data-color="#3a2a20" style="background:#3a2a20" title="Dark clay"></button>
          <button class="cs-mat-preset" data-color="#c9a47a" style="background:#c9a47a" title="Sand"></button>
          <button class="cs-mat-preset" data-color="#5a4a3a" style="background:#5a4a3a" title="Stone"></button>
          <button class="cs-mat-preset" data-color="#a85c3a" style="background:#a85c3a" title="Rust"></button>
          <button class="cs-mat-preset" data-color="#e8dcc4" style="background:#e8dcc4" title="Porcelain"></button>
          <button class="cs-mat-preset" data-color="#2d3a4a" style="background:#2d3a4a" title="Slate blue"></button>
          <button class="cs-mat-preset" data-color="#4a3a5a" style="background:#4a3a5a" title="Plum"></button>
        </div>
      </div>
    </div>

    <!-- ── Bottom Dock ──────────────────────────────────────── -->
    <div class="cs-bottom">
      <div class="cs-mode-chip">
        <span class="cs-mode-dot"></span>
        <span>Wheel Mode</span>
      </div>
      <div class="cs-speed-wrap">
        <span class="cs-speed-label">Speed</span>
        <input class="cs-speed-slider" id="cs-speed" type="range" min="0" max="40" step="0.05" value="24.00" />
        <span class="cs-speed-val" id="cs-speed-v">24.00</span>
      </div>
      <button class="cs-reset-btn" id="cs-reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/>
          <path d="M3 4v5h5"/>
        </svg>
        <span>Reset</span>
      </button>
    </div>

  </div>

  <!-- ═══════════════════════════════════════════════════════════
       WEBCAM PREVIEW
       ═══════════════════════════════════════════════════════════ -->
  <div id="webcam-preview">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="skeleton"></canvas>
    <div class="cam-label">webcam</div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       SCRIPTS
       Order matters: Three.js → scene → clay → hands model →
       MediaPipe → hand tracking → sculpt loop → UI → app
       ═══════════════════════════════════════════════════════════ -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="js/scene.js?v=14"></script>
  <script src="js/clay.js?v=14"></script>
  <script src="js/wooden-hands.js?v=14"></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="js/hands.js?v=14"></script>

  <script src="js/sculpt.js?v=14"></script>
  <script src="js/ui.js?v=14"></script>
  <script src="js/app.js?v=14"></script>

</body>
</html>
